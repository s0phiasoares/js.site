<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOWORLD 🌍</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>INFOWORLD 🌍</h1>
            <p>Descubra informações sobre o país que você deseja pesquisar 🗺️</p>
        </header>
        
        <main class="content">
            <div class="input-section">
                <input type="text" id="countryInput" placeholder="Exemplo: Brazil, Japan, Germany..." autocomplete="off">
                <button class="btn" id="searchBtn">🔍 Buscar País</button>
            </div>
            
            <div class="error-message" id="errorMsg"></div>
            <div class="warning-message" id="warningMsg"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Buscando informações...</p>
            </div>
            
            <div class="info-message" id="infoMsg">
                Digite o nome de um país e clique em <strong>Buscar informações</strong> para começar.
            </div>
            
            <div class="result" id="result">
                <img class="flag" id="flag" alt="Bandeira">
                <div class="country-info">
                    <h2 id="countryName"></h2>
                    <div class="info-grid" id="infoGrid">
                        <!-- Conteúdo preenchido via JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
